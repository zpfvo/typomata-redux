name: Checks

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: python-typomata-redux
    steps:
      - uses: actions/checkout@v4
        with:
          path: python-typomata-redux
      - uses: actions/checkout@v4
        with:
          repository: zpfvo/typomata
          ref: 53bf9aa2ef2d59574217c13477df8e46c2914ec1
          path: typomata
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.10"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked mypy
      - run: uv run --locked pyright
      - run: uv run --locked python scripts/verify_typing.py
      - run: uv run --locked python examples/counter.py
      - run: uv run --locked python scripts/verify_distribution.py
